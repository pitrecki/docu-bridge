name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and install library
        run: ./mvnw --batch-mode install
      - name: Verify independent starter consumer
        run: ./mvnw --batch-mode --file integration-tests/starter-consumer/pom.xml verify
