name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and install library
        run: ./mvnw --batch-mode install
      - name: Ensure consumer requires an explicit library version
        run: |
          if ./mvnw --batch-mode --file integration-tests/starter-consumer/pom.xml validate; then
            printf '%s\n' 'Consumer unexpectedly accepted an unspecified library version.' >&2
            exit 1
          fi
      - name: Verify independent starter consumer
        run: ./scripts/verify-consumer.sh
